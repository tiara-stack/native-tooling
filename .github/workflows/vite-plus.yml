name: Custom Vite+

on:
  pull_request:
    paths:
      - ".github/workflows/vite-plus.yml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "packages/vite-plus/**"
      - "packages/vite-plus-core/**"
      - "packages/vite-plus-effect-fork/**"
      - "packages/effect-vitest/**"
      - "scripts/build-vite-plus.mjs"
      - "scripts/prepare-vite-plus.mjs"
      - "scripts/lib/**"
      - "scripts/test/**"
      - "scripts/sync-effect-vitest.mjs"
      - "packages/tsgo-effect/**"
      - "scripts/check-vite-plus-package.mjs"
      - "scripts/sync-vite-plus.mjs"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/vite-plus.yml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "packages/vite-plus/**"
      - "packages/vite-plus-core/**"
      - "packages/vite-plus-effect-fork/**"
      - "packages/effect-vitest/**"
      - "scripts/build-vite-plus.mjs"
      - "scripts/prepare-vite-plus.mjs"
      - "scripts/lib/**"
      - "scripts/test/**"
      - "scripts/sync-effect-vitest.mjs"
      - "packages/tsgo-effect/**"
      - "scripts/check-vite-plus-package.mjs"
      - "scripts/sync-vite-plus.mjs"
  workflow_dispatch:

jobs:
  vite-plus:
    name: custom vite-plus package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          package_json_file: package.json

      - name: Install Vite+ source Rust toolchain
        run: rustup toolchain install nightly-2026-08-02 --component rust-src --profile minimal

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build package wrappers
        run: pnpm build

      - name: Verify custom Vite+ package
        run: pnpm check:vite-plus

      - name: Test native selection and generator lifecycle
        run: |
          node --test \
            scripts/test/vite-plus-native.test.mjs \
            scripts/test/vite-plus-source-environment.test.mjs \
            scripts/test/sync-effect-vitest.test.mjs

      - name: Verify Vite+ CLI
        run: node packages/vite-plus-effect-fork/packages/cli/bin/vp --version

      - name: Verify packed Effect helper runtime
        run: pnpm check:effect-vitest:consumer

      - name: Dry-run Vite+ npm pack
        run: npm pack --dry-run --json
        working-directory: packages/vite-plus
