name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Tiara Vite+
        uses: tiara-stack/setup-vp@v1
        with:
          version: "0.2.2"
          node-version: "22"
          cache: true
          run-install: false

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: true
          cache-dependency-path: |
            native/effect-tsgo/go.sum
            native/tsgolint-effect-fork/go.sum
            native/typescript-go/go.sum

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/oxc-oxlint-effect-fork

      - name: Install dependencies
        run: vp install

      - name: Build package wrappers
        run: vp run -w build

      - name: Lint package wrappers
        run: vp run -w lint

      - name: Test package wrappers
        run: vp run -w test

      - name: Verify custom Vite+ package
        run: vp run -w check:vite-plus

      - name: Build native tooling
        run: vp run -w native:build

      - name: Stage native binaries
        run: vp run -w native:stage

      - name: Verify package binary resolution
        run: |
          node packages/tsgolint-effect/bin/tsgolint-effect.mjs --print-path
          node packages/oxlint-effect/bin/oxlint-effect.mjs --print-path
          node packages/oxlint-effect/bin/oxlint-effect.mjs --version

      - name: Run native headless smoke test
        run: vp run -w native:smoke
