name: Stage npm packages

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Build and validate package staging without uploading to npm"
        type: boolean
        default: true
      tag:
        description: "npm dist-tag for staged packages"
        type: string
        default: "latest"
      package-filter:
        description: "vp package filter for staged packages"
        type: string
        default: "./packages/*"
      build-native:
        description: "Build and stage native binaries before publishing"
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-stage-${{ github.ref }}
  cancel-in-progress: false

jobs:
  stage:
    name: stage npm packages
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          package_json_file: package.json

      - name: Setup Go
        if: ${{ github.event_name != 'workflow_dispatch' || inputs['build-native'] }}
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
          cache: true
          cache-dependency-path: |
            native/effect-tsgo/go.sum
            native/tsgolint-effect-fork/go.sum
            native/typescript-go/go.sum

      - name: Setup Rust
        if: ${{ github.event_name != 'workflow_dispatch' || inputs['build-native'] }}
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust builds
        if: ${{ github.event_name != 'workflow_dispatch' || inputs['build-native'] }}
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/oxc-oxlint-effect-fork

      - name: Install Vite+ source Rust toolchain
        run: rustup toolchain install nightly-2026-08-02 --component rust-src --profile minimal

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build native tooling
        if: ${{ github.event_name != 'workflow_dispatch' || inputs['build-native'] }}
        run: pnpm native:build

      - name: Verify native compiler and diagnostic protocol
        if: ${{ github.event_name != 'workflow_dispatch' || inputs['build-native'] }}
        run: vp run -w native:test:backend

      - name: Stage native binaries
        if: ${{ github.event_name != 'workflow_dispatch' || inputs['build-native'] }}
        run: pnpm native:stage

      - name: Build and test package wrappers
        run: |
          pnpm build
          pnpm lint
          pnpm test
          pnpm check:vite-plus

      - name: Verify package binary resolution
        if: ${{ github.event_name != 'workflow_dispatch' || inputs['build-native'] }}
        run: |
          node packages/tsgo-effect/bin/tsgo-effect.mjs --print-path
          node packages/tsgo-effect/bin/tsgo-effect.mjs --version
          node packages/tsgolint-effect/bin/tsgolint-effect.mjs --print-path
          node packages/oxlint-effect/bin/oxlint-effect.mjs --print-path
          node packages/oxlint-effect/bin/oxlint-effect.mjs --version

      - name: Run native headless smoke test
        if: ${{ github.event_name != 'workflow_dispatch' || inputs['build-native'] }}
        run: pnpm native:smoke

      - name: Dry-run staged publish
        if: ${{ github.event_name == 'workflow_dispatch' && inputs['dry-run'] }}
        run: vp pm stage publish -r --filter "${{ inputs['package-filter'] }}" --access public --provenance --tag "${{ inputs.tag }}" --dry-run -- --no-git-checks

      - name: Stage packages for npm trusted publishing
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs['dry-run'] }}
        run: vp pm stage publish -r --filter "${{ inputs['package-filter'] || './packages/*' }}" --access public --provenance --tag "${{ inputs.tag || 'latest' }}" -- --no-git-checks
